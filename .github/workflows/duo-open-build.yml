name: Temporary Duo Open Full build
on:
  push:
    paths:
      - .github/workflows/duo-open-build.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: marcoazeem/duo-open
          ref: b6d6c8dccf63999b407c59ca9c9c6e423ecd2643
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Full debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullDebug
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/full/debug/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-Full-Shizuku-b6d6c8d
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
